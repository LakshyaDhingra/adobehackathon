name: Verify Chameleon submission
on:
  push:
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libglib2.0-0 fontconfig
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_submission.py --seeds 40
      - run: python scripts/verify_docker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/verification
  express-addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: express-addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: express-addon/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build -- --analytics off
