name: Verify Chameleon submission
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libglib2.0-0 fontconfig
      - run: pip install -r requirements.lock
      - name: Run Python tests
        shell: bash
        run: |
          mkdir -p artifacts/verification
          python -m unittest discover -s tests -v 2>&1 | tee artifacts/verification/python-tests.log
      - run: python scripts/verify_submission.py --seeds 60
      - run: python scripts/verify_docker.py
      - run: python scripts/package_submission.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/verification
      - uses: actions/upload-artifact@v4
        with:
          name: submission-bundles
          path: |
            artifacts/chameleon-submission.zip
            artifacts/chameleon-express-addon.zip
          if-no-files-found: error
  express-addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: express-addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: express-addon/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build -- --analytics off
